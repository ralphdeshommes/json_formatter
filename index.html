<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Viewer with Path Navigator</title>
    <style>
        :root {
            --color-accent: #b45309;
            --color-accent-hover: #92400e;
            --color-accent-light: #fef3e8;
            --color-danger: #b91c1c;
            --color-danger-light: #fef2f2;
            --color-bg: #faf9f7;
            --color-surface: #ffffff;
            --color-surface-alt: #f7f5f2;
            --color-border: #e2ded7;
            --color-text: #1c1917;
            --color-text-muted: #78716c;
            --color-text-faint: #a8a29e;
            --radius-sm: 4px;
            --radius-md: 6px;
            --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--color-bg);
            min-height: 100vh;
            padding: 0;
            color: var(--color-text);
            font-size: 14px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 20px 24px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--color-border);
        }

        h1 {
            font-size: 1.05em;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        h1 .accent {
            color: var(--color-accent);
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            background: var(--color-surface);
            color: var(--color-text);
            transition: background-color 0.1s ease, border-color 0.1s ease;
        }

        .btn:hover {
            background: var(--color-surface-alt);
            border-color: #cbc5ba;
        }

        .btn:active {
            background: #efece6;
        }

        .btn-primary {
            background: var(--color-accent);
            color: #fff;
            border-color: var(--color-accent);
        }

        .btn-primary:hover {
            background: var(--color-accent-hover);
            border-color: var(--color-accent-hover);
        }

        .btn-danger {
            color: var(--color-danger);
            border-color: var(--color-border);
        }

        .btn-danger:hover {
            background: var(--color-danger-light);
            border-color: #eab8b8;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            background: var(--color-surface);
            border-color: var(--color-border);
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1.2fr 0.8fr;
            gap: 16px;
            margin-bottom: 20px;
            align-items: start;
        }

        .panel {
            background: var(--color-surface);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--color-border);
        }

        .panel h2 {
            color: var(--color-text-muted);
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
        }

        .panel-header h2 {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .segmented {
            display: inline-flex;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .segmented-btn {
            padding: 4px 10px;
            border: none;
            border-left: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .segmented-btn:first-child {
            border-left: none;
        }

        .segmented-btn:hover {
            background: var(--color-surface-alt);
        }

        .segmented-btn.active {
            background: var(--color-accent);
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 600px;
            padding: 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.15s;
            line-height: 1.6;
            background: var(--color-surface-alt);
            color: var(--color-text);
        }

        textarea::placeholder {
            color: var(--color-text-faint);
        }

        textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            background: #fff;
        }

        .tree-container {
            width: 100%;
            min-height: 600px;
            max-height: 600px;
            overflow: auto;
            padding: 14px;
            background: var(--color-surface-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .tree-item {
            margin-left: 18px;
            padding: 3px 0;
        }

        .tree-root {
            margin-left: 0;
        }

        .tree-content {
            margin-left: 2px;
            padding-left: 14px;
            border-left: 1px dashed var(--color-border);
        }

        .tree-toggle {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            width: 18px;
            color: var(--color-text-faint);
            font-weight: bold;
            font-size: 11px;
        }

        .tree-toggle:hover {
            color: var(--color-text);
        }

        .tree-key {
            color: #0f4c81;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .tree-key:hover {
            background-color: var(--color-accent-light);
        }

        .tree-value {
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
            transition: background-color 0.15s;
        }

        .tree-value:hover {
            background-color: var(--color-accent-light);
        }

        .tree-string {
            color: #15803d;
        }

        .tree-number {
            color: #b45309;
            font-weight: 600;
        }

        .tree-boolean {
            color: #6d28d9;
            font-weight: 600;
        }

        .tree-null {
            color: var(--color-text-faint);
            font-weight: 600;
            font-style: italic;
        }

        .tree-bracket {
            color: var(--color-text);
            font-weight: bold;
        }

        .collapsed-content {
            display: none;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }

        .data-table th,
        .data-table td {
            padding: 6px 10px;
            border-bottom: 1px solid var(--color-border);
            text-align: left;
            white-space: nowrap;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .data-table thead th {
            position: sticky;
            top: 0;
            background: var(--color-surface-alt);
            color: var(--color-text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .data-table td {
            cursor: pointer;
        }

        .data-table td.row-index,
        .data-table td.key-cell {
            color: var(--color-text-muted);
            font-weight: 600;
        }

        .data-table td.missing-cell {
            color: var(--color-text-faint);
        }

        .data-table tbody tr:hover td {
            background: var(--color-accent-light);
        }

        .data-table td.selected {
            background: var(--color-accent) !important;
            color: #fff;
        }

        .table-empty,
        .table-scalar {
            padding: 16px;
            color: var(--color-text-muted);
        }

        .table-preview {
            color: var(--color-text-muted);
            font-style: italic;
        }

        .tree-item.selected .tree-key,
        .tree-item.selected .tree-value {
            background-color: var(--color-accent);
            color: white;
        }

        .path-panel {
            background: var(--color-surface);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--color-border);
        }

        .path-panel h2 {
            color: var(--color-text-muted);
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .path-panel h3 {
            color: var(--color-text-faint);
            margin-bottom: 8px;
            font-size: 0.7em;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .breadcrumb {
            background: var(--color-surface-alt);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            margin-bottom: 18px;
            font-family: var(--font-mono);
            font-size: 13px;
            word-break: break-all;
            min-height: 44px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            display: inline-block;
            color: #0f4c81;
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: var(--color-text-faint);
            margin: 0 4px;
        }

        .info-section {
            background: var(--color-surface-alt);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            margin-bottom: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--color-border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: var(--color-text-muted);
            font-size: 13px;
        }

        .info-value {
            color: var(--color-text);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
        }

        .value-preview {
            background: var(--color-surface-alt);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            font-family: var(--font-mono);
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow: auto;
            color: var(--color-text);
        }

        .error {
            background: var(--color-danger-light);
            color: #991b1b;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            border: 1px solid #f3caca;
            border-left: 3px solid var(--color-danger);
            font-size: 13px;
            line-height: 1.5;
        }

        .error code {
            background: rgba(185, 28, 28, 0.08);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--color-surface);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            border-left: 2px solid var(--color-accent);
            flex: 1;
            min-width: 150px;
        }

        .stat-label {
            color: var(--color-text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-value {
            color: var(--color-text);
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        textarea::-webkit-scrollbar,
        .tree-container::-webkit-scrollbar,
        .value-preview::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        textarea::-webkit-scrollbar-track,
        .tree-container::-webkit-scrollbar-track,
        .value-preview::-webkit-scrollbar-track {
            background: transparent;
        }

        textarea::-webkit-scrollbar-thumb,
        .tree-container::-webkit-scrollbar-thumb,
        .value-preview::-webkit-scrollbar-thumb {
            background: #ded8ce;
            border-radius: 20px;
        }

        textarea::-webkit-scrollbar-thumb:hover,
        .tree-container::-webkit-scrollbar-thumb:hover,
        .value-preview::-webkit-scrollbar-thumb:hover {
            background: #c2b9ab;
        }

        @media (max-width: 1200px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>JSON<span class="accent">Viewer</span></h1>
            <div class="controls">
                <button class="btn btn-primary" onclick="parseJSON()">Visualize</button>
                <button class="btn" id="expandAllBtn" onclick="expandAll()">Expand All</button>
                <button class="btn" id="collapseAllBtn" onclick="collapseAll()">Collapse All</button>
                <button class="btn" onclick="copyPath()">Copy Path</button>
                <button class="btn btn-danger" onclick="clearAll()">Clear</button>
                <button class="btn" onclick="loadSample()">Load Sample</button>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-box">
                <div class="stat-label">Total Keys</div>
                <div class="stat-value" id="totalKeys">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Depth</div>
                <div class="stat-value" id="maxDepth">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Objects</div>
                <div class="stat-value" id="objectCount">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Arrays</div>
                <div class="stat-value" id="arrayCount">0</div>
            </div>
        </div>

        <div class="panels">
            <div class="panel">
                <h2>Input</h2>
                <textarea id="input" placeholder="Paste your JSON here..."></textarea>
                <div id="error"></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Tree</h2>
                    <div class="segmented" role="tablist">
                        <button class="segmented-btn active" id="treeViewBtn" type="button" onclick="setTreeView('tree')">Tree</button>
                        <button class="segmented-btn" id="tableViewBtn" type="button" onclick="setTreeView('table')">Table</button>
                    </div>
                </div>
                <div id="tree" class="tree-container"></div>
            </div>

            <div class="path-panel">
                <h2>Path</h2>
                <div class="breadcrumb" id="breadcrumb">
                    <span style="color: #a8a29e;">Click any key or value to see its path</span>
                </div>

                <h3>Details</h3>
                <div class="info-section" id="details">
                    <div style="color: #a8a29e; text-align: center; padding: 20px;">
                        No selection
                    </div>
                </div>

                <h3>Value Preview</h3>
                <div class="value-preview" id="valuePreview">
                    <span style="color: #a8a29e;">Select an item to preview its value</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let jsonData = null;
        let currentPath = [];
        let parseTimeout;
        let viewMode = 'tree';

        // Auto-parse on input with debounce
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('input');
            input.addEventListener('input', function() {
                clearTimeout(parseTimeout);
                parseTimeout = setTimeout(parseJSON, 500);
            });
        });

        function setTreeView(mode) {
            if (mode === viewMode) return;
            viewMode = mode;
            document.getElementById('treeViewBtn').classList.toggle('active', mode === 'tree');
            document.getElementById('tableViewBtn').classList.toggle('active', mode === 'table');
            document.getElementById('expandAllBtn').disabled = mode === 'table';
            document.getElementById('collapseAllBtn').disabled = mode === 'table';
            if (jsonData !== null) renderCurrentView();
        }

        function renderCurrentView() {
            const tree = document.getElementById('tree');
            tree.innerHTML = '';
            if (viewMode === 'table') {
                renderTable(jsonData, tree);
            } else {
                renderTree(jsonData, tree, []);
            }
        }

        function parseJSON() {
            let input = document.getElementById('input').value.trim();
            const error = document.getElementById('error');
            const tree = document.getElementById('tree');
            const stats = document.getElementById('stats');
            
            error.innerHTML = '';
            
            if (!input) {
                error.innerHTML = '<div class="error">Please enter some JSON data</div>';
                return;
            }
            
            try {
                // Remove any trailing commas before closing braces/brackets
                let cleanedInput = input.replace(/,(\s*[}\]])/g, '$1');
                
                // Auto-fix: add missing closing braces/brackets
                let openBraces = (cleanedInput.match(/{/g) || []).length;
                let closeBraces = (cleanedInput.match(/}/g) || []).length;
                let openBrackets = (cleanedInput.match(/\[/g) || []).length;
                let closeBrackets = (cleanedInput.match(/\]/g) || []).length;
                
                while (openBraces > closeBraces) {
                    cleanedInput += '}';
                    closeBraces++;
                }
                while (openBrackets > closeBrackets) {
                    cleanedInput += ']';
                    closeBrackets++;
                }
                
                jsonData = JSON.parse(cleanedInput);
                renderCurrentView();
                updateStats(jsonData);
                stats.style.display = 'flex';
                resetPathInfo();
            } catch (e) {
                // Show last 100 chars for debugging
                const endChars = input.slice(-100);
                error.innerHTML = `<div class="error"><strong>Parse Error:</strong> ${e.message}<br><small>Last 100 chars: <code>${endChars}</code></small></div>`;
                tree.innerHTML = '';
                stats.style.display = 'none';
            }
        }

        function renderTree(obj, container, path, key = null) {
            const item = document.createElement('div');
            item.className = path.length === 0 ? 'tree-item tree-root' : 'tree-item';
            
            if (obj === null) {
                item.innerHTML = createLeaf(key, 'null', 'null', path);
            } else if (Array.isArray(obj)) {
                item.innerHTML = createBranch(key, 'array', obj.length, path);
                const content = document.createElement('div');
                content.className = 'tree-content';
                obj.forEach((val, idx) => {
                    renderTree(val, content, [...path, idx], idx);
                });
                item.appendChild(content);
            } else if (typeof obj === 'object') {
                item.innerHTML = createBranch(key, 'object', Object.keys(obj).length, path);
                const content = document.createElement('div');
                content.className = 'tree-content';
                Object.entries(obj).forEach(([k, v]) => {
                    renderTree(v, content, [...path, k], k);
                });
                item.appendChild(content);
            } else if (typeof obj === 'string') {
                item.innerHTML = createLeaf(key, `"${obj}"`, 'string', path);
            } else if (typeof obj === 'number') {
                item.innerHTML = createLeaf(key, obj, 'number', path);
            } else if (typeof obj === 'boolean') {
                item.innerHTML = createLeaf(key, obj, 'boolean', path);
            }
            
            container.appendChild(item);
        }

        function createBranch(key, type, count, path) {
            const toggle = '<span class="tree-toggle" onclick="toggleBranch(event)">▼</span>';
            const keyStr = key !== null ? `<span class="tree-key" onclick="selectItem(event, ${JSON.stringify(path).replace(/"/g, '&quot;')})">${key}</span>: ` : '';
            const bracket = type === 'array' ? '[' : '{';
            const closeBracket = type === 'array' ? ']' : '}';
            const countStr = `<span style="color: #a8a29e; font-size: 11px;"> // ${count} items</span>`;
            return `${toggle}${keyStr}<span class="tree-bracket">${bracket}</span>${countStr}<span class="collapsed-preview" style="display:none;"><span class="tree-bracket">...</span><span class="tree-bracket">${closeBracket}</span></span>`;
        }

        function createLeaf(key, value, type, path) {
            const keyStr = key !== null ? `<span class="tree-key" onclick="selectItem(event, ${JSON.stringify(path).replace(/"/g, '&quot;')})">${key}</span>: ` : '';
            return `<span style="width: 20px; display: inline-block;"></span>${keyStr}<span class="tree-value tree-${type}" onclick="selectItem(event, ${JSON.stringify(path).replace(/"/g, '&quot;')})">${value}</span>`;
        }

        function pathAttr(path) {
            return JSON.stringify(path).replace(/"/g, '&quot;');
        }

        function cellPreview(value) {
            if (value === null) return { text: 'null', cls: 'tree-null' };
            if (Array.isArray(value)) return { text: `[${value.length} items]`, cls: 'table-preview' };
            if (typeof value === 'object') return { text: `{${Object.keys(value).length} keys}`, cls: 'table-preview' };
            if (typeof value === 'string') {
                const truncated = value.length > 60 ? value.slice(0, 60) + '…' : value;
                return { text: `"${truncated}"`, cls: 'tree-string' };
            }
            if (typeof value === 'number') return { text: String(value), cls: 'tree-number' };
            if (typeof value === 'boolean') return { text: String(value), cls: 'tree-boolean' };
            return { text: String(value), cls: '' };
        }

        function renderTable(data, container) {
            container.appendChild(buildTableForValue(data, []));
        }

        function buildTableForValue(value, path) {
            if (Array.isArray(value)) return buildArrayTable(value, path);
            if (value !== null && typeof value === 'object') return buildObjectTable(value, path);
            const div = document.createElement('div');
            div.className = 'table-scalar';
            const p = cellPreview(value);
            div.innerHTML = `<span class="${p.cls}">${p.text}</span>`;
            return div;
        }

        function buildArrayTable(arr, path) {
            const wrap = document.createElement('div');

            if (arr.length === 0) {
                wrap.className = 'table-empty';
                wrap.textContent = 'Empty array';
                return wrap;
            }

            const allRecords = arr.every(item => item !== null && typeof item === 'object' && !Array.isArray(item));

            if (allRecords) {
                const columns = [];
                arr.forEach(obj => {
                    Object.keys(obj).forEach(k => {
                        if (!columns.includes(k)) columns.push(k);
                    });
                });

                let html = `<table class="data-table"><thead><tr><th>#</th>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
                arr.forEach((obj, i) => {
                    const rowPath = [...path, i];
                    html += `<tr><td class="row-index" onclick="selectTableCell(event, ${pathAttr(rowPath)})">${i}</td>`;
                    columns.forEach(col => {
                        if (!(col in obj)) {
                            html += `<td class="missing-cell" onclick="selectTableCell(event, ${pathAttr(rowPath)})">—</td>`;
                        } else {
                            const p = cellPreview(obj[col]);
                            html += `<td onclick="selectTableCell(event, ${pathAttr([...rowPath, col])})"><span class="${p.cls}">${p.text}</span></td>`;
                        }
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
                wrap.innerHTML = html;
            } else {
                let html = `<table class="data-table"><thead><tr><th>#</th><th>Value</th></tr></thead><tbody>`;
                arr.forEach((item, i) => {
                    const cellPath = [...path, i];
                    const p = cellPreview(item);
                    html += `<tr><td class="row-index" onclick="selectTableCell(event, ${pathAttr(cellPath)})">${i}</td><td onclick="selectTableCell(event, ${pathAttr(cellPath)})"><span class="${p.cls}">${p.text}</span></td></tr>`;
                });
                html += `</tbody></table>`;
                wrap.innerHTML = html;
            }

            return wrap;
        }

        function buildObjectTable(obj, path) {
            const entries = Object.entries(obj);
            const wrap = document.createElement('div');

            if (entries.length === 0) {
                wrap.className = 'table-empty';
                wrap.textContent = 'Empty object';
                return wrap;
            }

            let html = `<table class="data-table"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>`;
            entries.forEach(([k, v]) => {
                const cellPath = [...path, k];
                const p = cellPreview(v);
                html += `<tr><td class="key-cell" onclick="selectTableCell(event, ${pathAttr(cellPath)})">${k}</td><td onclick="selectTableCell(event, ${pathAttr(cellPath)})"><span class="${p.cls}">${p.text}</span></td></tr>`;
            });
            html += `</tbody></table>`;
            wrap.innerHTML = html;
            return wrap;
        }

        function selectTableCell(event, path) {
            event.stopPropagation();

            document.querySelectorAll('.data-table td.selected').forEach(el => el.classList.remove('selected'));

            let target = event.target;
            while (target && target.tagName !== 'TD') {
                target = target.parentElement;
            }
            if (target) target.classList.add('selected');

            currentPath = path;
            updatePathInfo(path);
        }

        function toggleBranch(event) {
            event.stopPropagation();
            const toggle = event.target;
            const item = toggle.parentElement;
            const content = item.querySelector('.tree-content');
            const preview = item.querySelector('.collapsed-preview');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                preview.style.display = 'none';
                toggle.textContent = '▼';
            } else {
                content.style.display = 'none';
                preview.style.display = 'inline';
                toggle.textContent = '▶';
            }
        }

        function selectItem(event, path) {
            event.stopPropagation();
            
            document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('selected'));
            
            let target = event.target;
            while (target && !target.classList.contains('tree-item')) {
                target = target.parentElement;
            }
            if (target) target.classList.add('selected');
            
            currentPath = path;
            updatePathInfo(path);
        }

        function updatePathInfo(path) {
            const breadcrumb = document.getElementById('breadcrumb');
            const details = document.getElementById('details');
            const valuePreview = document.getElementById('valuePreview');
            
            let pathStr = 'root';
            if (path.length > 0) {
                pathStr += path.map(p => typeof p === 'number' ? `[${p}]` : `.${p}`).join('');
            }
            
            breadcrumb.innerHTML = pathStr.split(/(\.|\\[|\\])/).filter(Boolean).map((part, idx) => {
                if (part === '.' || part === '[' || part === ']') {
                    return `<span class="breadcrumb-separator">${part}</span>`;
                }
                return `<span class="breadcrumb-item">${part}</span>`;
            }).join('');
            
            let value = jsonData;
            for (const p of path) {
                value = value[p];
            }
            
            const type = Array.isArray(value) ? 'array' : typeof value;
            let size = '-';
            if (type === 'array') size = value.length;
            else if (type === 'object' && value !== null) size = Object.keys(value).length;
            else if (type === 'string') size = value.length + ' chars';
            
            details.innerHTML = `
                <div class="info-row">
                    <span class="info-label">Type:</span>
                    <span class="info-value">${type}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Path:</span>
                    <span class="info-value">${pathStr}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Depth:</span>
                    <span class="info-value">${path.length}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Size:</span>
                    <span class="info-value">${size}</span>
                </div>
            `;
            
            if (type === 'object' || type === 'array') {
                valuePreview.textContent = JSON.stringify(value, null, 2);
            } else {
                valuePreview.textContent = JSON.stringify(value);
            }
        }

        function resetPathInfo() {
            document.getElementById('breadcrumb').innerHTML = '<span style="color: #a8a29e;">Click any key or value to see its path</span>';
            document.getElementById('details').innerHTML = '<div style="color: #a8a29e; text-align: center; padding: 20px;">No selection</div>';
            document.getElementById('valuePreview').innerHTML = '<span style="color: #a8a29e;">Select an item to preview its value</span>';
        }

        function updateStats(obj) {
            const stats = analyzeJSON(obj);
            document.getElementById('totalKeys').textContent = stats.totalKeys;
            document.getElementById('maxDepth').textContent = stats.maxDepth;
            document.getElementById('objectCount').textContent = stats.objectCount;
            document.getElementById('arrayCount').textContent = stats.arrayCount;
        }

        function analyzeJSON(obj, depth = 0) {
            let stats = { totalKeys: 0, maxDepth: depth, objectCount: 0, arrayCount: 0 };
            
            if (obj === null || typeof obj !== 'object') return stats;
            
            if (Array.isArray(obj)) {
                stats.arrayCount = 1;
                obj.forEach(item => {
                    const subStats = analyzeJSON(item, depth + 1);
                    stats.totalKeys += subStats.totalKeys;
                    stats.maxDepth = Math.max(stats.maxDepth, subStats.maxDepth);
                    stats.objectCount += subStats.objectCount;
                    stats.arrayCount += subStats.arrayCount;
                });
            } else {
                stats.objectCount = 1;
                Object.entries(obj).forEach(([key, value]) => {
                    stats.totalKeys++;
                    const subStats = analyzeJSON(value, depth + 1);
                    stats.totalKeys += subStats.totalKeys;
                    stats.maxDepth = Math.max(stats.maxDepth, subStats.maxDepth);
                    stats.objectCount += subStats.objectCount;
                    stats.arrayCount += subStats.arrayCount;
                });
            }
            
            return stats;
        }

        function expandAll() {
            document.querySelectorAll('.tree-content').forEach(el => {
                el.style.display = 'block';
            });
            document.querySelectorAll('.collapsed-preview').forEach(el => {
                el.style.display = 'none';
            });
            document.querySelectorAll('.tree-toggle').forEach(el => {
                el.textContent = '▼';
            });
        }

        function collapseAll() {
            document.querySelectorAll('.tree-content').forEach(el => {
                el.style.display = 'none';
            });
            document.querySelectorAll('.collapsed-preview').forEach(el => {
                el.style.display = 'inline';
            });
            document.querySelectorAll('.tree-toggle').forEach(el => {
                el.textContent = '▶';
            });
        }

        function copyPath() {
            const breadcrumb = document.getElementById('breadcrumb');
            const text = breadcrumb.innerText;
            
            if (!text || text.includes('Click any')) {
                alert('Please select an item first!');
                return;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                alert('✓ Path copied to clipboard!');
            });
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('tree').innerHTML = '';
            document.getElementById('error').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            resetPathInfo();
            jsonData = null;
            currentPath = [];
        }
